<!DOCTYPE html>
<html>
<head>
<title>Bootstrap 2 - forms</title>
<link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
<div class="container">
  <h2>Default form</h2>
  <form>
    <label>Label name</label>
    <input type="text" placeholder="Type something">
    <span class="help-block">Example block-level help text here.</span>
    <label class="checkbox"><input type="checkbox"> Check me out</label>
    <button type="submit" class="btn">Submit</button>
  </form>

  <h2>Horizontal form</h2>
  <form class="form-horizontal">
    <div class="control-group">
      <label class="control-label" for="inputEmail">Email</label>
      <div class="controls"><input type="text" id="inputEmail" placeholder="Email"></div>
    </div>
    <div class="control-group error">
      <label class="control-label" for="inputPassword">Password</label>
      <div class="controls">
        <input type="password" id="inputPassword" placeholder="Password">
        <span class="help-inline">Please correct the error</span>
      </div>
    </div>
    <div class="control-group">
      <div class="controls"><button type="submit" class="btn btn-primary">Sign in</button></div>
    </div>
  </form>

  <h2>Inline form</h2>
  <form class="form-inline">
    <input type="text" class="input-small" placeholder="Email">
    <input type="password" class="input-small" placeholder="Password">
    <label class="checkbox"><input type="checkbox"> Remember me</label>
    <button type="submit" class="btn">Sign in</button>
  </form>

  <h2>Sizes / selects / textarea</h2>
  <form>
    <input class="input-mini" type="text" placeholder="mini">
    <input class="input-small" type="text" placeholder="small">
    <input class="input-medium" type="text" placeholder="medium">
    <input class="input-large" type="text" placeholder="large">
    <input class="span4" type="text" placeholder="span4">
    <br>
    <select><option>Option one</option><option>Option two</option></select>
    <br>
    <textarea rows="3" placeholder="textarea"></textarea>
    <h3>Prepend / append</h3>
    <div class="input-prepend"><span class="add-on">@</span><input type="text" placeholder="Username"></div>
    <div class="input-append"><input type="text"><span class="add-on">.00</span></div>
    <h3>Uneditable</h3>
    <span class="uneditable-input">Some value here</span>
  </form>
</div>
</body>
</html>
