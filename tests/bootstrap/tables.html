<!DOCTYPE html>
<html>
<head>
<title>Bootstrap 2 - tables</title>
<link rel="stylesheet" href="bootstrap.css">
</head>
<body>
<div class="container">
  <h2>Basic .table</h2>
  <table class="table">
    <thead><tr><th>#</th><th>First</th><th>Last</th><th>Handle</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Mark</td><td>Otto</td><td>@mdo</td></tr>
      <tr><td>2</td><td>Jacob</td><td>Thornton</td><td>@fat</td></tr>
      <tr><td>3</td><td>Larry</td><td>the Bird</td><td>@twitter</td></tr>
    </tbody>
  </table>

  <h2>Striped + bordered + condensed</h2>
  <table class="table table-striped table-bordered table-condensed">
    <thead><tr><th>#</th><th>First</th><th>Last</th><th>Handle</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Mark</td><td>Otto</td><td>@mdo</td></tr>
      <tr><td>2</td><td>Jacob</td><td>Thornton</td><td>@fat</td></tr>
      <tr><td>3</td><td>Larry</td><td>the Bird</td><td>@twitter</td></tr>
      <tr><td>4</td><td>Pete</td><td>Best</td><td>@pete</td></tr>
    </tbody>
  </table>

  <h2>Row classes</h2>
  <table class="table">
    <tbody>
      <tr class="success"><td>success</td><td>ok</td></tr>
      <tr class="error"><td>error</td><td>bad</td></tr>
      <tr class="warning"><td>warning</td><td>hmm</td></tr>
      <tr class="info"><td>info</td><td>fyi</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
