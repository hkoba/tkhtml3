<!DOCTYPE html>
<html>
<head>
<title>Bootstrap 2 - buttons</title>
<link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
<div class="container">
  <h2>Buttons</h2>
  <p>
    <button class="btn">Default</button>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-inverse">Inverse</button>
    <button class="btn btn-link">Link</button>
  </p>
  <h2>Sizes</h2>
  <p>
    <button class="btn btn-large btn-primary">Large</button>
    <button class="btn btn-primary">Normal</button>
    <button class="btn btn-small btn-primary">Small</button>
    <button class="btn btn-mini btn-primary">Mini</button>
  </p>
  <h2>Disabled</h2>
  <p>
    <button class="btn" disabled>Default</button>
    <button class="btn btn-primary disabled">Primary</button>
  </p>
  <h2>Anchor buttons</h2>
  <p>
    <a class="btn" href="#">Anchor</a>
    <a class="btn btn-success" href="#">Success anchor</a>
  </p>
  <h2>Button groups</h2>
  <div class="btn-group">
    <button class="btn">Left</button>
    <button class="btn">Middle</button>
    <button class="btn">Right</button>
  </div>
  <h2>Toolbar</h2>
  <div class="btn-toolbar">
    <div class="btn-group">
      <button class="btn">1</button>
      <button class="btn">2</button>
    </div>
    <div class="btn-group">
      <button class="btn">3</button>
    </div>
  </div>
  <h2>Dropdown (static open)</h2>
  <div class="btn-group open">
    <button class="btn dropdown-toggle">Action <span class="caret"></span></button>
    <ul class="dropdown-menu" style="display: block; position: static;">
      <li><a href="#">First item</a></li>
      <li><a href="#">Second item</a></li>
      <li class="divider"></li>
      <li><a href="#">Third item</a></li>
    </ul>
  </div>
</div>
</body>
</html>
